<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Arial, Helvetica, sans-serif">
  <title>A Sokoban board and the text the language model actually reads</title>
  <rect width="1000" height="470" fill="#ffffff"/>
  <text x="30" y="40" font-size="20" font-weight="bold" fill="#0b0b0b">What the model sees: a board, written down</text>
  <text x="30" y="66" font-size="14" fill="#52514e">A real 5-box test level (v4 format). The model writes everything after the first ACTION line.</text>

  <!-- board: 8x8, cell 40px, origin (40,100) -->
  <g transform="translate(40,100)">
    <!-- floor -->
    <rect x="0" y="0" width="320" height="320" fill="#f4f3ef"/>
    <!-- walls -->
    <g fill="#52514e">
      <rect x="0" y="0" width="320" height="40"/><rect x="0" y="280" width="320" height="40"/>
      <rect x="0" y="0" width="40" height="320"/><rect x="280" y="0" width="40" height="320"/>
      <rect x="200" y="40" width="40" height="40"/>
      <rect x="120" y="160" width="40" height="40"/><rect x="200" y="160" width="40" height="40"/>
    </g>
    <!-- grid lines -->
    <g stroke="#ffffff" stroke-width="2">
      <line x1="40" y1="0" x2="40" y2="320"/><line x1="80" y1="0" x2="80" y2="320"/><line x1="120" y1="0" x2="120" y2="320"/>
      <line x1="160" y1="0" x2="160" y2="320"/><line x1="200" y1="0" x2="200" y2="320"/><line x1="240" y1="0" x2="240" y2="320"/>
      <line x1="280" y1="0" x2="280" y2="320"/>
      <line x1="0" y1="40" x2="320" y2="40"/><line x1="0" y1="80" x2="320" y2="80"/><line x1="0" y1="120" x2="320" y2="120"/>
      <line x1="0" y1="160" x2="320" y2="160"/><line x1="0" y1="200" x2="320" y2="200"/><line x1="0" y1="240" x2="320" y2="240"/>
      <line x1="0" y1="280" x2="320" y2="280"/>
    </g>
    <!-- goals: (1,3) (1,6) (2,6) (6,4) and (4,1) under box A -->
    <g fill="none" stroke="#1baf7a" stroke-width="3">
      <circle cx="140" cy="60" r="9"/><circle cx="260" cy="60" r="9"/><circle cx="260" cy="100" r="9"/>
      <circle cx="180" cy="260" r="9"/>
    </g>
    <!-- boxes: A(4,1 on goal) B(5,3) C(5,6) D(6,1) E(6,3) -->
    <g>
      <rect x="45" y="165" width="30" height="30" rx="4" fill="#1baf7a"/>
      <rect x="125" y="205" width="30" height="30" rx="4" fill="#eda100"/>
      <rect x="245" y="205" width="30" height="30" rx="4" fill="#eda100"/>
      <rect x="45" y="245" width="30" height="30" rx="4" fill="#eda100"/>
      <rect x="125" y="245" width="30" height="30" rx="4" fill="#eda100"/>
    </g>
    <g font-size="14" font-weight="bold" fill="#0b0b0b" text-anchor="middle">
      <text x="60" y="185">A</text><text x="140" y="225">B</text><text x="260" y="225">C</text>
      <text x="60" y="265">D</text><text x="140" y="265">E</text>
    </g>
    <!-- player (3,6) -->
    <circle cx="260" cy="140" r="13" fill="#2a78d6"/>
    <!-- action arrow LEFT -->
    <path d="M 244 140 L 212 140" stroke="#0b0b0b" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>
    <!-- coordinate ticks -->
    <g font-size="11" fill="#8a8984" text-anchor="middle">
      <text x="20" y="-8">0</text><text x="60" y="-8">1</text><text x="100" y="-8">2</text><text x="140" y="-8">3</text>
      <text x="180" y="-8">4</text><text x="220" y="-8">5</text><text x="260" y="-8">6</text><text x="300" y="-8">7</text>
    </g>
    <g font-size="11" fill="#8a8984" text-anchor="end">
      <text x="-6" y="24">0</text><text x="-6" y="64">1</text><text x="-6" y="104">2</text><text x="-6" y="144">3</text>
      <text x="-6" y="184">4</text><text x="-6" y="224">5</text><text x="-6" y="264">6</text><text x="-6" y="304">7</text>
    </g>
  </g>
  <!-- legend under board -->
  <g font-size="12" fill="#52514e" transform="translate(40,445)">
    <circle cx="6" cy="-4" r="6" fill="#2a78d6"/><text x="18" y="0">player</text>
    <rect x="70" y="-10" width="12" height="12" rx="2" fill="#eda100"/><text x="88" y="0">box</text>
    <circle cx="136" cy="-4" r="6" fill="none" stroke="#1baf7a" stroke-width="2.5"/><text x="148" y="0">goal</text>
    <rect x="190" y="-10" width="12" height="12" rx="2" fill="#1baf7a"/><text x="208" y="0">box on goal</text>
  </g>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/>
    </marker>
  </defs>

  <!-- arrow between -->
  <path d="M 385 260 L 425 260" stroke="#8a8984" stroke-width="2" fill="none" marker-end="url(#ah)"/>

  <!-- text panel -->
  <rect x="440" y="88" width="530" height="362" rx="8" fill="#f8f8f6" stroke="#e6e5e1"/>
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#0b0b0b">
    <text x="458" y="114">TASK TRANSCRIPT</text>
    <text x="458" y="132">SIZE 8x8</text>
    <text x="458" y="150">r0: # # # # # # # #</text>
    <text x="458" y="168">r1: # . . g . # g #</text>
    <text x="458" y="186" fill="#8a8984">... (one labelled row per board row)</text>
    <text x="458" y="204">WALLS [[0,0],[0,1],...,[4,3],[4,5],...]</text>
    <text x="458" y="222">BOXES A B C D E</text>
    <text x="458" y="240">STATE</text>
    <text x="458" y="258">player 3 6 | A 4 1 | B 5 3 | ... | E 6 3</text>
    <text x="458" y="276">END</text>
    <text x="458" y="300" font-weight="bold">ACTION LEFT</text>
    <text x="458" y="318">STATE</text>
  </g>
  <rect x="452" y="326" width="410" height="62" rx="6" fill="#e6f0fb" stroke="#2a78d6" stroke-width="1.5"/>
  <g font-family="Menlo, Consolas, monospace" font-size="13" fill="#0b0b0b">
    <text x="462" y="346">player 3 5</text>
    <text x="462" y="364">A 4 1 | B 5 3 | C 5 6 | D 6 1 | E 6 3</text>
    <text x="462" y="382">END</text>
  </g>
  <text x="872" y="352" font-size="12" fill="#1c5cab">written by</text>
  <text x="872" y="368" font-size="12" fill="#1c5cab">the model,</text>
  <text x="872" y="384" font-size="12" fill="#1c5cab">fed back as-is</text>
  <text x="458" y="414" font-size="12" fill="#52514e">(box lines are one per line in the real transcript;</text>
  <text x="458" y="432" font-size="12" fill="#52514e"> joined with "|" here to fit)</text>
</svg>
