<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Arial, Helvetica, sans-serif">
  <title>The self-fed transcript and the two references every step is checked against</title>
  <rect width="1000" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <text x="30" y="40" font-size="20" font-weight="bold" fill="#0b0b0b">Rolling out "in belief": the model reads its own writing</text>
  <text x="30" y="66" font-size="14" fill="#52514e">Nothing is repaired between steps, so a mistake stays in the context and we can watch what happens next.</text>

  <!-- transcript column -->
  <g font-family="Menlo, Consolas, monospace" font-size="13">
    <rect x="30" y="90" width="360" height="40" rx="6" fill="#f4f3ef"/>
    <text x="44" y="115" fill="#0b0b0b">initial board + walls + state (given)</text>
    <rect x="30" y="140" width="360" height="30" rx="6" fill="#ffffff" stroke="#e6e5e1"/>
    <text x="44" y="160" fill="#0b0b0b">ACTION DOWN</text>
    <rect x="30" y="178" width="360" height="30" rx="6" fill="#e6f0fb" stroke="#2a78d6"/>
    <text x="44" y="198" fill="#0b0b0b">STATE  (model) ✓</text>
    <rect x="30" y="216" width="360" height="30" rx="6" fill="#ffffff" stroke="#e6e5e1"/>
    <text x="44" y="236" fill="#0b0b0b">ACTION DOWN   ← into a wall</text>
    <rect x="30" y="254" width="360" height="30" rx="6" fill="#fdeee7" stroke="#eb6834"/>
    <text x="44" y="274" fill="#0b0b0b">STATE  (model) ✗ player moved anyway</text>
    <rect x="30" y="292" width="360" height="30" rx="6" fill="#ffffff" stroke="#e6e5e1"/>
    <text x="44" y="312" fill="#0b0b0b">ACTION RIGHT</text>
    <rect x="30" y="330" width="360" height="30" rx="6" fill="#ffffff" stroke="#52514e" stroke-dasharray="5 4"/>
    <text x="44" y="350" fill="#0b0b0b">STATE  (model) ?</text>
  </g>
  <path d="M 395 269 C 430 269, 430 345, 398 345" stroke="#eb6834" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="438" y="305" font-size="12" fill="#52514e">its own wrong</text>
  <text x="438" y="320" font-size="12" fill="#52514e">state is now context</text>

  <!-- references -->
  <rect x="560" y="90" width="410" height="105" rx="10" fill="#f8f8f6" stroke="#e6e5e1"/>
  <text x="578" y="116" font-size="15" font-weight="bold" fill="#0b0b0b">Each step is compared with two answers</text>
  <text x="578" y="142" font-size="13" fill="#0b0b0b"><tspan font-weight="bold">truth</tspan> = simulator(true previous state, action)</text>
  <text x="578" y="166" font-size="13" fill="#0b0b0b"><tspan font-weight="bold">self-consistent</tspan> = simulator(model's own previous</text>
  <text x="578" y="184" font-size="13" fill="#0b0b0b">state, action): "right, given what it believed"</text>

  <!-- category table -->
  <g font-size="13">
    <rect x="560" y="210" width="410" height="30" fill="#f4f3ef"/>
    <text x="574" y="230" font-weight="bold" fill="#0b0b0b">previous step</text>
    <text x="700" y="230" font-weight="bold" fill="#0b0b0b">this step</text>
    <text x="820" y="230" font-weight="bold" fill="#0b0b0b">verdict</text>
    <text x="574" y="262" fill="#0b0b0b">right</text><text x="700" y="262" fill="#0b0b0b">= truth</text><text x="820" y="262" fill="#0b0b0b">correct</text>
    <text x="574" y="288" fill="#0b0b0b">right</text><text x="700" y="288" fill="#0b0b0b">≠ truth</text><text x="820" y="288" fill="#c2410c" font-weight="bold">new error</text>
    <text x="574" y="314" fill="#0b0b0b">wrong</text><text x="700" y="314" fill="#0b0b0b">= self-consistent</text><text x="820" y="314" fill="#0b0b0b">follows own path</text>
    <text x="574" y="340" fill="#0b0b0b">wrong</text><text x="700" y="340" fill="#0b0b0b">= truth</text><text x="820" y="340" fill="#15803d" font-weight="bold">recovers</text>
    <text x="574" y="366" fill="#0b0b0b">impossible</text><text x="700" y="366" fill="#0b0b0b">anything</text><text x="820" y="366" fill="#0b0b0b">after impossible</text>
    <text x="574" y="392" fill="#0b0b0b">wrong</text><text x="700" y="392" fill="#0b0b0b">neither</text><text x="820" y="392" fill="#0b0b0b">confused</text>
    <line x1="560" y1="272" x2="970" y2="272" stroke="#e6e5e1"/><line x1="560" y1="298" x2="970" y2="298" stroke="#e6e5e1"/>
    <line x1="560" y1="324" x2="970" y2="324" stroke="#e6e5e1"/><line x1="560" y1="350" x2="970" y2="350" stroke="#e6e5e1"/>
    <line x1="560" y1="376" x2="970" y2="376" stroke="#e6e5e1"/>
  </g>
  <text x="30" y="410" font-size="13" fill="#52514e">"Teacher-forced" accuracy = the same prediction, but with the</text>
  <text x="30" y="428" font-size="13" fill="#52514e">true history in context: pure physics, no compounding.</text>
  <text x="560" y="428" font-size="13" fill="#52514e">"impossible" = player in a wall, two boxes on one cell, a box missing.</text>
</svg>
